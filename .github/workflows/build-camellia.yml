name: Build camellia UEFI skeleton

on:
  workflow_dispatch:
  push:
    branches: ["main", "camellia"]
    paths:
      - "Platforms/Xiaomi/camelliaPkg/**"
      - "Silicon/MediaTek/MT6833Pkg/**"
      - "Silicon/Silicium/SiliciumPkg/**"
      - "Resources/Configs/camellia.toml"
      - "Resources/DTBs/camellia.dtb"
      - ".github/workflows/build-camellia.yml"

permissions:
  contents: read

concurrency:
  group: camellia-uefi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        timeout-minutes: 30
        run: |
          bash ./setup_env.sh -p apt

      - name: Build hot-jump UEFI
        timeout-minutes: 30
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          ./build-camellia-hotjump.sh -c

      - name: Build cold-boot UEFI
        timeout-minutes: 30
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          ./build-camellia-coldboot.sh

      - name: Upload camellia UEFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uefi-camellia-debug-skeleton
          path: |
            dist/SILICIUM_UEFI-hotjump.fd
            dist/SILICIUM_UEFI-coldboot.fd
            Platforms/Xiaomi/camelliaPkg/PORTING.md
          if-no-files-found: error
          compression-level: 9
