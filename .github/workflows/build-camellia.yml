name: Build camellia UEFI skeleton

on:
  workflow_dispatch:
    inputs:
      fd_base:
        description: UEFI FD base (0x40080000 cold boot, 0xA0000000 Linux hot jump)
        required: true
        default: "0x40080000"
  push:
    branches: ["camellia", "feature/camellia-bringup"]
    paths:
      - "Platforms/Xiaomi/camelliaPkg/**"
      - "Silicon/MediaTek/MT6833Pkg/**"
      - "Silicon/Silicium/SiliciumPkg/**"
      - "Resources/Configs/camellia.toml"
      - "Resources/DTBs/camellia.dtb"
      - ".github/workflows/build-camellia.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build camellia UEFI
        env:
          FD_BASE: ${{ inputs.fd_base }}
        run: |
          if [ -n "$FD_BASE" ]; then
            sed -i "s|^base = 0x40080000$|base = ${FD_BASE}|" Resources/Configs/camellia.toml
          fi
          bash ./setup_env.sh -p apt
          python3 build_uefi.py -d camellia -r DEBUG

      - name: Upload camellia UEFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uefi-camellia-debug-skeleton
          path: |
            Mu-camellia.img
            Build/camelliaPkg/**/FV/**
            Platforms/Xiaomi/camelliaPkg/PORTING.md
          if-no-files-found: error
          compression-level: 9
